<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Arena Kids"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Arena Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;900&display=swap">
<style>
/* Lobby: one committed look - deep blue arena backdrop, chunky outlined game UI, yellow PLAY */
:root{color-scheme:dark;--ink:#0b1020;--text:#fff;--muted:#c9d4ea;--volt:#ffd21f;--volt2:#f0a400;--blue:#2f8bff;--blue2:#1a56c4;--red:#ff4d42;--ok:#3fdc5d;--plate:rgba(12,18,38,.78);
  --f-game:"Lilita One","Rubik","Arial Hebrew",Arial,sans-serif;--f-body:"Rubik","Heebo","Arial Hebrew",Arial,sans-serif;
  --sl:max(12px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));--st:max(10px,env(safe-area-inset-top,0px));--sb:max(12px,env(safe-area-inset-bottom,0px))}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.g{font-family:var(--f-game);letter-spacing:.02em;text-shadow:0 3px 0 #000;-webkit-text-stroke:1px #000;paint-order:stroke fill}
/* backdrop: the cover art, blurred and pushed back, with rotating light rays behind the hero */
#bg{position:fixed;inset:-30px;background:url(splash.jpg) center 35%/cover;filter:blur(14px) saturate(1.2) brightness(.55);transform:scale(1.06)}
#tint{position:fixed;inset:0;background:radial-gradient(ellipse 55% 60% at 50% 58%,rgba(70,140,255,.45),transparent 70%),linear-gradient(180deg,rgba(8,14,34,.55),rgba(6,10,26,.2) 40%,rgba(4,7,18,.85))}
#rays{position:fixed;left:50%;top:56%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* top-left: profile */
#prof{position:fixed;top:var(--st);left:var(--sl);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--plate);border:3px solid #000;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);direction:ltr;max-width:min(330px,46vw)}
#lvl{position:relative;flex:none;width:54px;height:58px;display:flex;align-items:center;justify-content:center}
#lvl svg{position:absolute;inset:0;width:100%;height:100%}
#lvl b{position:relative;font-size:1.45rem;color:#fff}
#pInfo{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
#pName{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:#fff;font-size:1.15rem;text-align:left;min-width:0}
#pName span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
#pName i{font-style:normal;font-size:.8rem;opacity:.75;flex:none}
#xp{position:relative;height:16px;min-width:130px;border-radius:9px;background:#060914;border:2px solid #000;overflow:hidden}
#xp i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,#9be7ff,#38b6ff 55%,#1f86d6);transition:width .9s cubic-bezier(.3,1.3,.5,1)}
#xp em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-game);font-size:.75rem;text-shadow:0 1px 0 #000}
/* top-right: currencies */
#res{position:fixed;top:var(--st);right:var(--sr);display:flex;gap:8px;direction:ltr}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 4px;background:var(--plate);border:3px solid #000;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.55);font-size:1.1rem}
.pill svg{width:30px;height:30px;flex:none}
/* hero name plate + arrows */
#heroBox{position:fixed;left:50%;bottom:calc(var(--sb) + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;direction:ltr}
.arrow{width:52px;height:52px;border-radius:50%;border:3px solid #000;background:linear-gradient(180deg,#4aa0ff,var(--blue2));box-shadow:0 4px 0 #000;font-family:var(--f-game);font-size:1.6rem;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.arrow:active,.btn:active,#play:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
#plate{min-width:200px;text-align:center;padding:6px 16px 8px;background:var(--plate);border:3px solid #000;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.55)}
#hName{font-size:1.7rem;line-height:1}
#hRole{font-size:.78rem;font-weight:700;color:var(--muted);direction:rtl;margin-top:2px}
#stats{display:flex;gap:10px;justify-content:center;margin-top:5px;direction:rtl}
#stats div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;font-weight:700;color:var(--muted)}
#stats div b{font-family:var(--f-game);font-size:.95rem;color:#fff;font-weight:400}
/* left column: armed / emote */
#tools{position:fixed;left:var(--sl);bottom:calc(var(--sb) + 8px);display:flex;flex-direction:column;gap:10px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:74px;height:70px;border:3px solid #000;border-radius:14px;background:linear-gradient(180deg,#3b4a74,#212b48);box-shadow:0 4px 0 #000;color:#fff;padding:0}
.btn svg{width:30px;height:30px}
.btn span{font-family:var(--f-game);font-size:.78rem;text-shadow:0 2px 0 #000}
.btn.on{background:linear-gradient(180deg,#ffe05a,#f0a400)}.btn.on span{color:#231a00;text-shadow:none}
/* bottom-right: mode + PLAY */
#playBox{position:fixed;right:var(--sr);bottom:calc(var(--sb) + 8px);display:flex;flex-direction:column;align-items:stretch;gap:8px;width:min(250px,40vw)}
#modeChip{display:flex;align-items:center;gap:10px;padding:6px 10px;border:3px solid #000;border-radius:14px;background:var(--plate);box-shadow:0 4px 0 rgba(0,0,0,.55);color:#fff;text-align:right;direction:rtl}
#modeChip .ic{flex:none;width:40px;height:40px;border-radius:9px;border:2px solid #000;background-size:cover;background-position:center}
#modeChip small{display:block;font-size:.66rem;font-weight:700;color:var(--muted)}
#modeChip b{display:block;font-family:var(--f-game);font-weight:400;font-size:1.05rem;text-shadow:0 2px 0 #000}
#play{position:relative;height:84px;border:4px solid #000;border-radius:18px;background:linear-gradient(180deg,#fff27a,var(--volt) 40%,var(--volt2));box-shadow:0 6px 0 #000,inset 0 -6px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.6);font-family:var(--f-game);font-size:2.6rem;color:#fff;text-shadow:0 4px 0 #000;-webkit-text-stroke:2px #000;paint-order:stroke fill;overflow:hidden}
#play::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
/* modals */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:var(--st) var(--sr) var(--sb) var(--sl);background:rgba(3,6,16,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.box{position:relative;width:min(880px,100%);max-height:100%;overflow:auto;padding:16px;border:4px solid #000;border-radius:20px;background:linear-gradient(180deg,#22305a,#121a36);box-shadow:0 8px 0 #000;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box h2{margin:0 0 12px;text-align:center;font-family:var(--f-game);font-weight:400;font-size:1.8rem;color:var(--volt);text-shadow:0 3px 0 #000;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.close{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:12px;border:3px solid #000;background:#d63c32;box-shadow:0 3px 0 #000;font-family:var(--f-game);font-size:1.2rem;color:#fff;padding:0}
#modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mode{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px;padding:0;border:4px solid #000;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #000;text-align:right;direction:rtl;background:#000}
.mode .art{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .3s}
.mode:hover .art{transform:scale(1.05)}
.mode .txt{position:relative;padding:12px 14px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85) 45%)}
.mode .tag{position:absolute;top:10px;right:10px;font-family:var(--f-game);font-size:.8rem;background:var(--volt);color:#231a00;border:2px solid #000;border-radius:8px;padding:2px 8px}
.mode b{display:block;font-family:var(--f-game);font-weight:400;font-size:1.6rem;line-height:1.05;color:#fff;text-shadow:0 3px 0 #000;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.mode p{margin:4px 0 0;font-size:.82rem;font-weight:500;color:#e6ecf8;line-height:1.35}
.mode.sel{outline:4px solid var(--volt);outline-offset:2px}
.mode:active{transform:translateY(3px)}
#mmBox{text-align:center}
#mmBox .slots{display:flex;gap:10px;justify-content:center;margin:14px 0;direction:ltr}
#mmBox .slot{width:70px;height:70px;border-radius:14px;border:3px solid #000;background:#0b1124;display:flex;align-items:center;justify-content:center;font-family:var(--f-game);font-size:1.6rem;color:#5b6a93;box-shadow:0 3px 0 #000;overflow:hidden}
#mmBox .slot.in{background:linear-gradient(180deg,#4aa0ff,var(--blue2));color:#fff;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
#mmBox .slot.in.foe{background:linear-gradient(180deg,#ff7a6e,#c4271e)}
#mmBox .slot img{width:100%;height:100%;object-fit:cover}
#mmText{font-family:var(--f-game);font-size:1.3rem;text-shadow:0 2px 0 #000}
#mmCancel{margin-top:12px;font-family:var(--f-game);background:#d63c32;border:3px solid #000;border-radius:12px;padding:8px 24px;box-shadow:0 4px 0 #000;color:#fff}
#nameBox{width:min(420px,100%);text-align:center}
#nameIn{width:100%;font:inherit;font-size:1.2rem;padding:10px 12px;border-radius:12px;border:3px solid #000;background:#0b1124;color:#fff;text-align:center;direction:auto}
#nameIn:focus{outline:3px solid var(--volt)}
.ok{margin-top:12px;font-family:var(--f-game);font-size:1.2rem;background:linear-gradient(180deg,#7dff8e,#2fc84a);color:#fff;text-shadow:0 2px 0 #000;border:3px solid #000;border-radius:12px;padding:8px 30px;box-shadow:0 4px 0 #000}
#rwBox{width:min(460px,100%);text-align:center}
#rwRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
#rwRow span{display:flex;align-items:center;gap:6px;font-family:var(--f-game);font-size:1.25rem;background:rgba(0,0,0,.4);border:3px solid #000;border-radius:12px;padding:6px 14px;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
#rwRow span:nth-child(2){animation-delay:.12s}#rwRow span:nth-child(3){animation-delay:.24s}
#rwUp{margin:10px auto 0;font-family:var(--f-game);font-size:1.5rem;color:#231a00;background:var(--volt);border:3px solid #000;border-radius:12px;padding:6px 16px;display:inline-block;animation:pop .5s .4s cubic-bezier(.2,1.6,.4,1) both}
#toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:30;font-family:var(--f-game);font-size:1.3rem;padding:8px 18px;background:rgba(0,0,0,.7);border:3px solid #000;border-radius:12px;white-space:nowrap;pointer-events:none}
@media (max-width:760px){#modes{grid-template-columns:1fr 1fr 1fr}.mode{min-height:150px}.mode p{display:none}}
@media (max-height:500px){#play{height:66px;font-size:2rem}#playBox{width:min(210px,34vw)}.btn{width:62px;height:56px}.btn svg{width:24px;height:24px}#plate{min-width:160px;padding:4px 12px 6px}#hName{font-size:1.3rem}#stats{display:none}.arrow{width:44px;height:44px}#heroBox{gap:8px}.mode{min-height:170px}.box{padding:12px}.box h2{font-size:1.4rem;margin-bottom:8px}}
@media (max-width:560px){#prof{max-width:56vw}.pill{height:32px;font-size:.95rem;padding:0 8px 0 2px}.pill svg{width:24px;height:24px}#res .gem{display:none}#heroBox{bottom:calc(var(--sb) + 172px)}#stats{display:none}#plate{min-width:150px}#playBox{width:min(230px,56vw)}#tools{bottom:calc(var(--sb) + 8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head><body>
<div id="bg"></div><div id="tint"></div><div id="rays"></div>
<canvas id="view"></canvas>

<button id="prof" type="button" aria-label="פרופיל">
  <div id="lvl"><svg viewBox="0 0 54 58"><path d="M27 2 51 15v28L27 56 3 43V15z" fill="#2f8bff" stroke="#000" stroke-width="3"/><path d="M27 7 46 18v22L27 51 8 40V18z" fill="#1a56c4"/></svg><b class="g" id="lvlN">1</b></div>
  <div id="pInfo"><div id="pName" class="g"><span id="pNameT">שחקן</span><i>✎</i></div><div id="xp"><i></i><em id="xpT">0/100</em></div></div>
</button>

<div id="res">
  <div class="pill g"><svg viewBox="0 0 32 32"><path d="M9 4h14v6a7 7 0 0 1-14 0z" fill="#ffd21f" stroke="#000" stroke-width="2"/><path d="M9 6H4c0 5 3 7 6 7M23 6h5c0 5-3 7-6 7" fill="none" stroke="#000" stroke-width="2"/><path d="M14 17h4v5h3v4H11v-4h3z" fill="#f0a400" stroke="#000" stroke-width="2"/></svg><span id="trT">0</span></div>
  <div class="pill g"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffc21f" stroke="#000" stroke-width="2.5"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="#c98a00" stroke-width="2"/><path d="M16 11v10" stroke="#c98a00" stroke-width="2.5"/></svg><span id="coT">0</span></div>
  <div class="pill g gem"><svg viewBox="0 0 32 32"><path d="M8 6h16l5 7-13 15L3 13z" fill="#3fdc5d" stroke="#000" stroke-width="2.2"/><path d="M3 13h26M12 6l-3 7 7 15 7-15-3-7" fill="none" stroke="#1d8a36" stroke-width="1.5"/></svg><span id="geT">0</span></div>
</div>

<div id="tools">
  <button id="armBtn" class="btn" type="button"><svg viewBox="0 0 32 32"><path d="M6 26 22 10l3-5 3 1-1 3-5 3L6 28z" fill="#e8eef8" stroke="#000" stroke-width="2"/><path d="M5 22l5 5" stroke="#000" stroke-width="3"/></svg><span>נשק</span></button>
  <button id="emoBtn" class="btn" type="button"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#ffd21f" stroke="#000" stroke-width="2.2"/><circle cx="12" cy="13" r="2"/><circle cx="20" cy="13" r="2"/><path d="M10 19c3 4 9 4 12 0" fill="none" stroke="#000" stroke-width="2.2"/></svg><span>ריקוד</span></button>
</div>

<div id="heroBox">
  <button class="arrow" id="prevH" type="button" aria-label="הגיבור הקודם">‹</button>
  <div id="plate"><div id="hName" class="g">Boy</div><div id="hRole">לוחם</div><div id="stats"></div></div>
  <button class="arrow" id="nextH" type="button" aria-label="הגיבור הבא">›</button>
</div>

<div id="playBox">
  <button id="modeChip" type="button"><span class="ic" id="modeIc"></span><span><small>מצב משחק</small><b id="modeN">Titan Rush</b></span></button>
  <button id="play" type="button">PLAY</button>
</div>

<div id="modeModal" class="modal" hidden>
  <div class="box"><button class="close" type="button" data-close>✕</button><h2>בחרו מצב משחק</h2>
    <div id="modes">
      <button class="mode" type="button" data-mode="city"><span class="art" id="artCity"></span><span class="tag">חדש!</span><span class="txt"><b>CITY HALL</b><p>3 נגד 3 · הרסו את העירייה, חברו חשמל לריבוע המדיק, השתלטו על טיטאן ושלטו ב-Hot Zone.</p></span></button>
      <button class="mode" type="button" data-mode="knock"><span class="art" id="artKnock"></span><span class="tag">חדש!</span><span class="txt"><b>KNOCKOUT</b><p>3 נגד 3 · בלי חזרה לחיים. חסלו את כל הקבוצה, הראשונים ל-2 סיבובים מנצחים.</p></span></button>
      <button class="mode" type="button" data-mode="titan"><span class="art" id="artTitan"></span><span class="txt"><b>TITAN RUSH</b><p>3 נגד 3 · כבשו עמודים, טענו טיטאן ענק וליוו אותו להשמיד את הכור של היריב.</p></span></button>
    </div>
  </div>
</div>

<div id="mmModal" class="modal" hidden>
  <div class="box" id="mmBox"><h2 id="mmTitle">TITAN RUSH</h2><div id="mmText">מחפש שחקנים…</div><div class="slots" id="mmSlots"></div><button id="mmCancel" type="button">ביטול</button></div>
</div>

<div id="nameModal" class="modal" hidden>
  <div class="box" id="nameBox"><button class="close" type="button" data-close>✕</button><h2>השם שלך</h2><input id="nameIn" maxlength="16" autocomplete="off" spellcheck="false"><button class="ok" id="nameOk" type="button">שמירה</button>
    <div id="profStats" style="margin-top:12px;font-size:.85rem;color:var(--muted)"></div></div>
</div>

<div id="rwModal" class="modal" hidden>
  <div class="box" id="rwBox"><h2 id="rwTitle">ניצחון!</h2><div id="rwRow"></div><div id="rwUpWrap"></div><button class="ok" id="rwOk" type="button">אחלה</button></div>
</div>
<div id="toast" hidden></div>
